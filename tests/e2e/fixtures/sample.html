<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>paperx e2e fixture</title>
  </head>
  <body style="margin:40px;font-family:system-ui">
    <h1 data-uid="hero-title-001" style="color:#111">Hello paperx</h1>
    <p data-uid="hero-desc-002" style="font-size:14px;color:#444">A sanity fixture for the extension.</p>
    <button data-uid="cta-btn-003" style="padding:8px 16px;font-size:14px">Click me</button>

    <!-- Snap-test pair: two ABSOLUTELY-positioned siblings so growing
         snap-A's width does NOT push snap-B sideways (flex+gap would).
         snap-A.right = 120, snap-B.left = 200 → 80 px gap. Dragging
         snap-A's E handle ~80 px right should park snap-A's right edge
         on snap-B's left edge, with the snap engine aligning to within
         4 px and rendering the magenta guide at x = 200 (in fixture
         coords). -->
    <div style="position:relative;height:80px;margin-top:32px">
      <div data-uid="snap-A-100" style="position:absolute;left:0;top:0;width:120px;height:60px;background:#cbd5e1"></div>
      <div data-uid="snap-B-200" style="position:absolute;left:200px;top:0;width:120px;height:60px;background:#fbbf24"></div>
    </div>

    <!-- v0.10.0 distance-measurement cases. Three predictable pairs
         exercising the visBug-style classifier:
           - dist-wrap-A contains dist-child-B → 'contained' (4 inset chips)
           - dist-vstack-A / dist-vstack-B share x range → 'vertical-gap'
             (1 outer chip on 'bottom')
           - dist-diag-A / dist-diag-B no axis overlap → 'diagonal'
             (2 outer chips + 2 alignment guides) -->
    <div style="position:relative;height:240px;margin-top:32px">
      <div data-uid="dist-wrap-A" style="position:absolute;left:0;top:0;width:300px;height:200px;background:#eee">
        <div data-uid="dist-child-B" style="position:absolute;left:50px;top:40px;width:100px;height:80px;background:#aaa"></div>
      </div>
      <div data-uid="dist-vstack-A" style="position:absolute;left:340px;top:0;width:120px;height:60px;background:#cfc"></div>
      <div data-uid="dist-vstack-B" style="position:absolute;left:340px;top:120px;width:120px;height:60px;background:#fcc"></div>
      <!-- diag pair sits clearly to the right + below of where the
           v0.11.0 auto-positioned DesignPanel would land (panel goes
           right of dist-diag-A → covers roughly x=644..924 in viewport).
           Keeping dist-diag-B at container-left:920 puts it past the
           panel's right edge so the e2e hover lands on B directly. -->
      <div data-uid="dist-diag-A" style="position:absolute;left:500px;top:0;width:80px;height:60px;background:#bdf"></div>
      <div data-uid="dist-diag-B" style="position:absolute;left:920px;top:160px;width:80px;height:60px;background:#fbd"></div>
    </div>
  </body>
</html>
